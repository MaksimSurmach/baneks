name: frontend
on: [push, pull_request]
env:
  VITE_NEON_DATA_API_URL: https://ep-proud-sound-baou4sxl.apirest.c-8.eu-central-1.aws.neon.tech/banksDB/rest/v1
  VITE_NEON_AUTH_URL: https://ep-proud-sound-baou4sxl.neonauth.c-8.eu-central-1.aws.neon.tech/banksDB/auth
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
